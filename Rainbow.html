
<!DOCTYPE html>
<html>
<head>
<style>
h1 {
font-size: 45px;
text-align: center;
background: linear-gradient(
    90deg, red, orange, purple, blue, pink
);
background-size: 300%;
color: transparent;
background-clip: text;
animation: rainbow 4s linear infinite;
}

@keyframes rainbow {
to { background-position: 300% center; }
}
</style>
</head>
<body>
<h1>Welcome to My World!</h1>
</body>
</html>
