<!DOCTYPE html>
<html>
<head>
<title>Typing Animation</title>
<style>
body {
    background: #172554;
    color: white;
    text-align: center;
    padding-top: 150px;
    font-family: Arial;
}
h1 {
    color: #67e8f9;
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid white;
    width: 0;
    margin: auto;
    animation: typing 4s steps(25) infinite alternate,
            blink .5s step-end infinite;
}
@keyframes typing {
    from { width: 0; }
    to { width: 25ch; }
}
@keyframes blink {
    50% { border-color: transparent; }
}
</style>
</head>
<body>
<h1>Hello, I'm Bhagyashri!</h1>
<p>AIML Student | Future Developer</p>
</body>
</html>
