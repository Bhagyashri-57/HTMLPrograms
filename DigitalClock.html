
<!DOCTYPE html>
<html>
<head>
<title>Digital Clock</title>
<style>
body {
    background: #e3f2fd;
    text-align: center;
    font-family: Arial;
    padding-top: 100px;
}
#clock {
    font-size: 55px;
    color: #1565c0;
    font-weight: bold;
}
</style>
</head>
<body>
<h1>⏰ My Digital Clock</h1>
<div id="clock"></div>
<script>
function updateClock() {
    document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
