
<!DOCTYPE html>
<html>
<head>
    <title>Birthday Wishes</title>
    <style>
        body {
            background: #fff0f5;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }
        h1 { color: #ff1493; }
        button {
            background: #ff69b4;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🎂 Happy Birthday! 🎉</h1>
    <p>May your day be full of love and happiness.</p>
    <button onclick="showWish()">Open Your Surprise</button>
    <h2 id="wish"></h2>

    <script>
        function showWish() {
            document.getElementById("wish").innerHTML =
                "Keep smiling and shining! 💖🎁";
        }
    </script>
</body>
</html>
