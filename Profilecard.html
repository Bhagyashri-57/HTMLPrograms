<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            background: #e8f4ff;
            font-family: Arial;
            text-align: center;
        }
        .card {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #aaa;
        }
        img {
            width: 100px;
            border-radius: 50%;
        }
        button {
            background: #2585d8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/100"
            alt="Profile">
        <h1>Bhagyashri</h1>
        <p>AIML Student</p>
        <p>Aspiring AI Developer</p>
        <button>Contact Me</button>
    </div>
</body>
</html>
